dependencies:
  flutter:
    sdk: flutter
  intl: ^0.20.2
  path: ^1.9.1
  shared_preferences: ^2.5.3
  package_info_plus: ^9.0.0
  dynamic_color: ^1.8.1
  flashy_tab_bar2: ^0.0.10
  flutter_riverpod: ^3.0.3
  iconly: ^1.0.1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  app_links: ^6.4.1
  http: ^1.5.0
  dart_des: ^1.0.2
  html: ^0.15.6
  html_unescape: ^2.0.0
  just_audio: ^0.10.5
  audio_session: ^0.2.2
  figma_squircle: ^0.6.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  marquee: ^2.3.0
  page_transition: ^2.2.1
  readmore: ^3.0.0
  flutter_swipe_action_cell: ^3.1.6
  toastification: ^3.0.3
  audio_service: ^0.18.18
  just_audio_background: ^0.0.1-beta.17
  drag_and_drop_lists: ^0.4.2
  share_plus: ^12.0.1
  dio: ^5.9.0
  path_provider: ^2.1.5
  flutter_local_notifications: ^19.5.0
  permission_handler: ^12.0.1
  internet_connection_checker_plus: ^2.9.0
  palette_generator_master: ^1.0.1
  disk_space_plus: ^0.2.6
  url_launcher: ^6.3.2
  image_picker: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  build_runner: ^2.9.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/fonts/
    - assets/icons/

  fonts:
    - family: SpotifyMix
      fonts:
        - asset: assets/fonts/SpotifyMix-Thin.ttf
          weight: 100
        - asset: assets/fonts/SpotifyMix-ThinItalic.ttf
          weight: 100
          style: italic

        - asset: assets/fonts/SpotifyMix-Light.ttf
          weight: 300
        - asset: assets/fonts/SpotifyMix-LightItalic.ttf
          weight: 300
          style: italic

        - asset: assets/fonts/SpotifyMix-Regular.ttf
          weight: 400
        - asset: assets/fonts/SpotifyMix-RegularItalic.ttf
          weight: 400
          style: italic

        - asset: assets/fonts/SpotifyMix-Medium.ttf
          weight: 500
        - asset: assets/fonts/SpotifyMix-MediumItalic.ttf
          weight: 500
          style: italic

        - asset: assets/fonts/SpotifyMix-Bold.ttf
          weight: 700
        - asset: assets/fonts/SpotifyMix-BoldItalic.ttf
          weight: 700
          style: italic

        - asset: assets/fonts/SpotifyMix-Extrabold.ttf
          weight: 800
        - asset: assets/fonts/SpotifyMix-ExtraboldItalic.ttf
          weight: 800
          style: italic

        - asset: assets/fonts/SpotifyMix-Black.ttf
          weight: 900
        - asset: assets/fonts/SpotifyMix-BlackItalic.ttf
          weight: 900
          style: italic

        - asset: assets/fonts/SpotifyMix-Ultra.ttf
          weight: 900
        - asset: assets/fonts/SpotifyMix-UltraItalic.ttf
          weight: 900
          style: italic

flutter_launcher_icons:
  android: "launcher_icon"
  image_path_android: "assets/icons/logo.png"
  adaptive_icon_foreground: "assets/icons/radio.png"
  adaptive_icon_background: "#1DDA63"
  adaptive_icon_monochrome: "assets/icons/radio.png"
  adaptive_icon_foreground_inset: 24
